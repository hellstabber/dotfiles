      - rsync
      - unzip
      - 7zip
      - man-db
      - man-pages
      - xdg-utils
      - shared-mime-info
      - flatpak

      # Shell / development
      - zsh
      - mise
      - rustup

      # Sway / Wayland
      - sway
      - swaybg
      - swayidle
      - swaylock
      - waybar
      - fuzzel
      - mako
      - ghostty
      - uwsm
      - wl-clipboard
