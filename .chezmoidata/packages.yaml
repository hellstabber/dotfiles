      # Laptop / hardware utilities
      - brightnessctl

      # Appearance
      - wlsunset

      # Fonts
      - ttf-ibm-plex
      - ttf-nerd-fonts-symbols-mono

      # Login
      - greetd
      - greetd-tuigreet

    # Desktop - GTX 1060 / Nouveau
    molly:
      - mesa
      - lib32-mesa
      - vulkan-nouveau
      - lib32-vulkan-nouveau

    # Dell G15 - Intel + RTX 4050
    funkypunk:
      - mesa
      - lib32-mesa
      - vulkan-intel
      - lib32-vulkan-intel
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-prime

    # MacBook Air 2017
    badapple: []

    # Only machines with gaming enabled
    gaming:
      - steam
      - lutris
      - wine
      - wine-mono
      - wine-gecko
      - winetricks
      - gamemode
      - lib32-gamemode
      - mangohud
      - lib32-mangohud
      - gamescope

  aur:
    common:
      - ungoogled-chromium-bin
      - vscodium-bin
      - vesktop-bin
      - ayugram-desktop-bin
      - mepo

flatpak:
  common: []

  gaming:
