      - gnome-keyring
      - seahorse

      # Media
      - mpv
      - yt-dlp
      - imv
      - transmission-gtk

      # CLI
      - jq
      - ripgrep
      - fd
      - fzf
      - zoxide
      - bat
      - eza
      - btop
      - yazi
