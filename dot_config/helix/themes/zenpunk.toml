purple_dk = "#684c7a"
purple = "#8f6aa8"
purple_lt = "#b89ad0"

amber_dk = "#8c5e3c"
amber = "#c98b5b"
amber_lt = "#e0ad83"

red = "#8f2d3c"
red_lt = "#c45a6a"

text = "#e6dfe8"
muted = "#7f7187"
dim = "#54495a"
